name: Doxygen GitHub Pages Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Doxygen
        run: sudo apt-get install doxygen graphviz gnuplot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup python environment
        env:
          PATH_PYBINDS: ${{ github.workspace }}/bindings/python
          PATH_PYSTUBS: ${{ github.workspace }}/bindings/python/basisSplines
        run: |
          pip install .[STUBS]
          python ${{ env.PATH_PYBINDS }}/basisSplines/buildStubs.py

      - name: Configure CMake
        run: cmake -B${{github.workspace}}/build -DBUILD_TEST=OFF -DBUILD_BENCHMARK=OFF -DBUILD_DOCS=ON -DBUILD_EXAMPLES=ON -DBUILD_PYBINDS=OFF

      - name: Build documentation and examples
        run: cmake --build ${{github.workspace}}/build

      - name: Generate example images
        env:
          PATH_WORKING_DIR: ${{ github.workspace }}
          PATH_BUILD: ${{ github.workspace }}/build
          PATH_EXAMPLE_BINS: ${{ github.workspace }}/build/examples/cpp
        run: |
          chmod +x examples/cpp/launch.bash
          ./examples/cpp/launch.bash -a

      - name: Copy images to docs/media
        run: |
          mkdir -p docs/media
          cp examples/cpp/out/*.jpg docs/media/

      - name: Upload example images
        uses: actions/upload-artifact@v4
        with:
          name: example-images
          path: examples/cpp/out/*.jpg
          retention-days: 90

      - name: Commit updated images
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/media/*.jpg
          git diff --staged --quiet || git commit --amend --no-edit
          git push --force-with-lease origin main

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          folder: build/docs/html